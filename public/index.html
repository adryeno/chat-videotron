<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Chat - Modern Clean Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body { 
            font-family: 'Quicksand', sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f4f9; 
            color: #333;
            width: 100%;
            overflow-x: hidden; 
        }
        
        .hidden { display: none !important; }

        #chatBox { 
            height: 70vh; 
            border: 3px solid #000;
            border-radius: 15px; 
            overflow-y: scroll; 
            padding: 20px 15px; 
            margin-bottom: 20px; 
            background: #eef2f3; 
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }
        
        /* TAMPILAN CHAT STANDAR (HP) */
        .msg { 
            position: relative;
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px; 
            padding: 8px 14px;
            margin-bottom: 10px; 
            max-width: 90%;
            word-wrap: break-word; 
            box-shadow: 3px 3px 0px #000; 
        }
        .msg strong { 
            font-family: 'Fredoka One', cursive; 
            font-weight: normal; 
            font-size: 15px; 
            display: block; 
            margin-bottom: 2px; 
        }
        .msg span.text { color: #000; font-weight: 700; font-size: 14px; }

        input, button { 
            width: 100%; padding: 15px; margin-bottom: 10px; 
            border: 3px solid #000; border-radius: 12px;
            font-size: 15px; font-family: 'Quicksand', sans-serif; font-weight: 700;
            box-shadow: 3px 3px 0px #000;
        }
        button { 
            background: #f39c12; color: #fff; border: 3px solid #000; 
            font-family: 'Fredoka One', cursive; font-size: 18px; letter-spacing: 1px;
            cursor: pointer; text-shadow: 2px 2px 0px #000;
        }

        h2 { font-family: 'Fredoka One', cursive; color: #f39c12; text-align: center; text-shadow: 2px 2px 0px #000;}

        /* ==========================================
           TAMPILAN KHUSUS VMIX (TRANSPARAN, TANPA BALON, NAMA: ISI)
           ========================================== */
        body.videotron-mode {
            background-color: rgba(0, 0, 0, 0) !important; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #displayQrWrapper {
            background: #ffffff;
            padding: 12px;
            border: 4px solid #000;
            border-radius: 15px;
            box-shadow: 6px 6px 0px #000;
            text-align: center;
            margin-bottom: 20px;
            align-self: center;
        }

        #displayQrCode canvas, #displayQrCode img {
            display: block;
            margin: 0 auto;
        }

        #displayQrWrapper span {
            display: block;
            margin-top: 6px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            color: #000;
            letter-spacing: 1px;
        }

        .videotron-mode #chatBox {
            height: 75vh; 
            border: none;
            border-radius: 0;
            background: transparent;
            overflow-y: hidden; 
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: flex-start;
            width: 100%;
        }

        /* Desain teks bersih tanpa balon (latar belakang transparan) */
        .videotron-mode .msg {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 4px 0 !important;
            margin-bottom: 8px !important; /* Sangat rapat */
        }

        /* Menghilangkan ekor balon komik */
        .videotron-mode .msg::after, 
        .videotron-mode .msg::before {
            display: none !important;
        }

        .videotron-mode .msg strong {
            font-size: 24px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            margin-bottom: 2px;
            display: inline;
            margin-right: 10px;
        }

        .videotron-mode .msg span.text {
            color: #ffffff !important; /* Teks putih agar kontras dan jelas dibaca di video */
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="homePage">
        <h2>Admin Panel ⚙️</h2>
        <button onclick="createRoom()">Buka Room Baru</button>
        <div id="adminQrContainer" style="margin-top: 20px; text-align: center;">
            <div id="adminQrcode" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
            <div id="roomLink" style="background: #fff; padding: 10px; border-radius: 8px; border: 3px solid #000; margin-bottom:10px; font-weight: bold;"></div>
            <div id="displayLink" style="background: #fff; padding: 10px; border-radius: 8px; border: 3px solid #000; font-weight: bold;"></div>
        </div>
    </div>

    <div id="joinPage" class="hidden">
        <h2>Join Obrolan! 💬</h2>
        <input type="text" id="username" placeholder="Siapa namamu?">
        <button onclick="joinRoom()">Gaskeun 🚀</button>
    </div>

    <div id="chatPage" class="hidden">
        <div id="displayQrWrapper" class="hidden">
            <div id="displayQrcode"></div>
            <span>SCAN TO JOIN!</span>
        </div>

        <div id="chatBox"></div>

        <div id="inputArea">
            <input type="text" id="messageInput" placeholder="Ketik pesan lucu (Bisa pakai emoji 😍)...">
            <button onclick="sendMessage()">KIRIM PESAN 🚀</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = '';
        let currentUser = '';

        const userColors = [
            '#FF5733', '#33FF57', '#3357FF', '#F39C12', 
            '#9B59B6', '#00FFFF', '#FF00FF', '#FFFF00', 
            '#FF6666', '#66FF66', '#6666FF', '#FFA07A'
        ];

        function getColorForUser(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % userColors.length;
            return userColors[index];
        }

        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        const isDisplay = urlParams.get('display') === 'true'; 

        if (roomParam) {
            currentRoomId = roomParam;
            document.getElementById('homePage').classList.add('hidden');
            
            if (isDisplay) {
                document.body.classList.add('videotron-mode');
                currentUser = 'Sistem Display';
                socket.emit('joinRoom', { roomId: currentRoomId, username: currentUser });
                
                document.getElementById('displayQrWrapper').classList.remove('hidden');
                const mobileUrl = `${window.location.origin}/?room=${currentRoomId}`;
                
                new QRCode(document.getElementById("displayQrcode"), {
                    text: mobileUrl, 
                    width: 200, 
                    height: 200, 
                    colorDark : "#000", 
                    colorLight : "#fff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                document.getElementById('chatPage').classList.remove('hidden');
                document.getElementById('inputArea').classList.add('hidden'); 
            } else {
                document.getElementById('joinPage').classList.remove('hidden');
            }
        }

        function createRoom() {
            socket.emit('createRoom');
        }

        socket.on('roomCreated', (roomId) => {
            const baseUrl = window.location.origin;
            const mobileUrl = `${baseUrl}/?room=${roomId}`;
            const vmixUrl = `${baseUrl}/?room=${roomId}&display=true`;
            
            document.getElementById('adminQrcode').innerHTML = '';
            new QRCode(document.getElementById("adminQrcode"), {
                text: mobileUrl, 
                width: 180, 
                height: 180, 
                colorDark : "#000", 
                colorLight : "#fff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            document.getElementById('roomLink').innerHTML = `<strong>Link HP (Bagikan ke peserta):</strong><br><a href="${mobileUrl}" target="_blank">${mobileUrl}</a>`;
            document.getElementById('displayLink').innerHTML = `<strong>Link vMix/OBS (Masukkan ke Browser Source):</strong><br><a href="${vmixUrl}" target="_blank">${vmixUrl}</a>`;
        });

        function joinRoom() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Isi nama dulu dong!');
            currentUser = name;
            socket.emit('joinRoom', { roomId: currentRoomId, username: currentUser });
            
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('chatPage').classList.remove('hidden');
        }

        function sendMessage() {
            const text = document.getElementById('messageInput').value;
            
            if (text.trim() !== '') {
                socket.emit('sendMessage', {
                    roomId: currentRoomId, username: currentUser, text: text, type: 'text'
                });
            }
            document.getElementById('messageInput').value = '';
        }

        socket.on('message', (data) => {
            if (data.username === 'Sistem' && data.text.includes('Sistem Display')) return;

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            
            const userColor = data.username === 'Sistem' ? '#aaaaaa' : getColorForUser(data.username);
            
            if (data.type === 'text') {
                msgDiv.innerHTML = `<strong style="color: ${userColor};">${data.username}:</strong> <span class="text">${data.text}</span>`;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (document.body.classList.contains('videotron-mode')) {
                const maxMessages = 10; // Memuat hingga 10 riwayat chat secara rapat
                if (chatBox.childElementCount > maxMessages) {
                    chatBox.removeChild(chatBox.firstElementChild);
                }
            }
        });

        socket.on('roomExpired', () => {
            alert('Waktu habis! Room sudah ditutup.');
            window.location.href = '/';
        });
        
        document.getElementById("messageInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
