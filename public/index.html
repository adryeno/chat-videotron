<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Chat - WhatsApp Bubble Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body { 
            font-family: 'Quicksand', sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f4f9; 
            color: #333;
            width: 100%;
            overflow-x: hidden; 
        }
        
        .hidden { display: none !important; }

        /* KOTAK CHAT KHUSUS HP (BISA DI-SCROLL NORMAL) */
        #chatBox { 
            height: 62vh; 
            border: 3px solid #000;
            border-radius: 15px; 
            overflow-y: scroll; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #eef2f3; 
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }
        
        .msg { 
            position: relative;
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px; 
            padding: 8px 14px;
            margin-bottom: 10px; 
            max-width: 90%;
            word-wrap: break-word; 
            box-shadow: 3px 3px 0px #000; 
        }
        .msg strong { 
            font-family: 'Fredoka One', cursive; 
            font-weight: normal; 
            font-size: 15px; 
            display: block; 
            margin-bottom: 2px; 
        }
        .msg span.text { color: #000; font-weight: 700; font-size: 14px; }

        #inputArea {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #messageInput { 
            flex: 1; 
            padding: 15px; 
            margin: 0; 
            border: 3px solid #000; 
            border-radius: 12px;
            font-size: 15px; 
            font-family: 'Quicksand', sans-serif; 
            font-weight: 700;
            box-shadow: 3px 3px 0px #000;
            background: #fff;
        }

        #sendButton { 
            width: auto;
            padding: 15px 25px; 
            margin: 0;
            background: #f39c12; 
            color: #fff; 
            border: 3px solid #000; 
            border-radius: 12px;
            font-family: 'Fredoka One', cursive; 
            font-size: 16px; 
            letter-spacing: 1px;
            cursor: pointer; 
            text-shadow: 2px 2px 0px #000;
            box-shadow: 3px 3px 0px #000;
            white-space: nowrap;
        }
        #sendButton:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }

        input[type="text"]#username {
            width: 100%; padding: 15px; margin-bottom: 10px; 
            border: 3px solid #000; border-radius: 12px;
            font-size: 15px; font-family: 'Quicksand', sans-serif; font-weight: 700;
            box-shadow: 3px 3px 0px #000;
        }
        
        button.main-btn {
            width: 100%; padding: 15px; margin-bottom: 10px; 
            border: 3px solid #000; border-radius: 12px;
            background: #f39c12; color: #fff; 
            font-family: 'Fredoka One', cursive; font-size: 18px; letter-spacing: 1px;
            cursor: pointer; text-shadow: 2px 2px 0px #000;
            box-shadow: 3px 3px 0px #000;
        }

        h2 { font-family: 'Fredoka One', cursive; color: #f39c12; text-align: center; text-shadow: 2px 2px 0px #000;}

        /* ==========================================
           TAMPILAN KHUSUS OBS (BINGKAI NEON & BUBBLE CHAT TRANSPARAN)
           ========================================== */
        body.videotron-mode {
            background-color: rgba(0, 0, 0, 0) !important; 
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body.videotron-mode #chatPage {
            display: flex !important;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 40px 30px 40px 30px; 
            box-sizing: border-box;
        }

        body.videotron-mode #displayQrWrapper {
            display: none !important;
        }

        body.videotron-mode #chatBox {
            flex: 1;
            width: 100%;
            height: auto !important;
            border: none;
            border-radius: 0;
            background: transparent;
            overflow: hidden !important; 
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: flex-start;
            margin-bottom: 0;
        }

        /* GAYA BUBBLE CHAT SEPERTI WHATSAPP (TRANSPARAN NYAMAN DIBACA) */
        body.videotron-mode .msg {
            background: rgba(0, 0, 0, 0.45) !important; /* Latar belakang transparan semi-gelap */
            backdrop-filter: blur(4px); /* Efek blur halus di belakang bubble */
            border: 1px solid rgba(255, 255, 255, 0.2) !important; /* Garis tepi tipis elegan */
            border-radius: 14px !important; /* Sudut melengkung ala WhatsApp */
            padding: 8px 14px !important; 
            margin-bottom: 8px !important; 
            flex-shrink: 0;
            max-width: 95%; 
            word-wrap: break-word; 
            overflow-wrap: break-word;
            white-space: normal;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body.videotron-mode .msg::after, 
        body.videotron-mode .msg::before {
            display: none !important;
        }

        body.videotron-mode .msg strong {
            font-size: 22px; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
            margin-bottom: 2px;
            display: block; /* Nama di atas, isi pesan di bawahnya ala WhatsApp */
        }

        body.videotron-mode .msg span.text {
            color: #ffffff !important; 
            font-size: 24px; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
            font-weight: 700;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="homePage">
        <h2>Admin Panel ⚙️</h2>
        <div id="adminQrContainer" style="margin-top: 10px; text-align: center;">
            <div id="adminQrcode" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
            <div id="roomLink" style="background: #fff; padding: 10px; border-radius: 8px; border: 3px solid #000; margin-bottom:10px; font-weight: bold;"></div>
            <div id="displayLink" style="background: #fff; padding: 10px; border-radius: 8px; border: 3px solid #000; font-weight: bold;"></div>
        </div>
    </div>

    <div id="joinPage" class="hidden">
        <h2>Join Obrolan! 💬</h2>
        <input type="text" id="username" placeholder="Siapa namamu?">
        <button class="main-btn" onclick="joinRoom()">Gaskeun 🚀</button>
    </div>

    <div id="chatPage" class="hidden">
        <div id="displayQrWrapper" class="hidden">
            <div id="displayQrcode"></div>
            <span>SCAN TO JOIN!</span>
        </div>

        <div id="chatBox"></div>

        <div id="inputArea">
            <input type="text" id="messageInput" placeholder="Ketik pesan lucu (Bisa pakai emoji 😍)...">
            <button id="sendButton" onclick="sendMessage()">KIRIM 🚀</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = '';
        let currentUser = '';

        const userColors = [
            '#FF5733', '#33FF57', '#3357FF', '#F39C12', 
            '#9B59B6', '#00FFFF', '#FF00FF', '#FFFF00', 
            '#FF6666', '#66FF66', '#6666FF', '#FFA07A'
        ];

        function getColorForUser(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % userColors.length;
            return userColors[index];
        }

        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        const isDisplay = urlParams.get('display') === 'true'; 

        const FIXED_ROOM_ID = 'main-room';

        if (roomParam) {
            currentRoomId = roomParam;
            document.getElementById('homePage').classList.add('hidden');
            
            if (isDisplay) {
                document.body.classList.add('videotron-mode');
                currentUser = 'Sistem Display';
                socket.emit('joinRoom', { roomId: currentRoomId, username: currentUser });
                
                document.getElementById('chatPage').classList.remove('hidden');
                document.getElementById('inputArea').classList.add('hidden'); 
            } else {
                document.getElementById('joinPage').classList.remove('hidden');
            }
        } else {
            window.addEventListener('DOMContentLoaded', () => {
                const baseUrl = window.location.origin;
                const mobileUrl = `${baseUrl}/?room=${FIXED_ROOM_ID}`;
                const obsUrl = `${baseUrl}/?room=${FIXED_ROOM_ID}&display=true`;
                
                socket.emit('joinRoom', { roomId: FIXED_ROOM_ID, username: 'AdminPanel' });

                document.getElementById('adminQrcode').innerHTML = '';
                new QRCode(document.getElementById("adminQrcode"), {
                    text: mobileUrl, 
                    width: 180, 
                    height: 180, 
                    colorDark : "#000", 
                    colorLight : "#fff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                
                document.getElementById('roomLink').innerHTML = `<strong>Link HP (Tetap/Permanen):</strong><br><a href="${mobileUrl}" target="_blank">${mobileUrl}</a>`;
                document.getElementById('displayLink').innerHTML = `<strong>Link OBS (Tetap/Permanen):</strong><br><a href="${obsUrl}" target="_blank">${obsUrl}</a>`;
            });
        }

        function joinRoom() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Isi nama dulu dong!');
            currentUser = name;
            socket.emit('joinRoom', { roomId: currentRoomId, username: currentUser });
            
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('chatPage').classList.remove('hidden');
        }

        function sendMessage() {
            const text = document.getElementById('messageInput').value;
            
            if (text.trim() !== '') {
                socket.emit('sendMessage', {
                    roomId: currentRoomId, username: currentUser, text: text, type: 'text'
                });
            }
            document.getElementById('messageInput').value = '';
        }

        socket.on('message', (data) => {
            if (data.username === 'Sistem' && data.text.includes('Sistem Display')) return;
            if (data.username === 'AdminPanel') return;

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            
            const userColor = data.username === 'Sistem' ? '#aaaaaa' : getColorForUser(data.username);
            
            if (data.type === 'text') {
                msgDiv.innerHTML = `<strong style="color: ${userColor};">${data.username}</strong><span class="text">${data.text}</span>`;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (document.body.classList.contains('videotron-mode')) {
                const maxMessages = 10; // Tetap mempertahankan 10 riwayat pesan di dalam bingkai
                while (chatBox.childElementCount > maxMessages) {
                    chatBox.removeChild(chatBox.firstElementChild);
                }
            }
        });

        socket.on('roomExpired', () => {
            alert('Waktu habis! Room sudah ditutup.');
            window.location.href = '/';
        });
        
        document.getElementById("messageInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
